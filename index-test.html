<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới Online</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fdfbf7;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }
    .card {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #f0e6df;
    }
    h1 { color: #d45d79; margin-bottom: 5px; }
    p { line-height: 1.6; color: #666; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #d45d79;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <p>SAVE THE DATE</p>
    <h1>Bảo Ân & Uyên Trang</h1>
    <p>Trân trọng mời bạn đến tham dự lễ kết hôn của chúng tôi!</p>
    <a href="#" class="btn" onclick="alert('Cảm ơn bạn!')">💌 Mở Thiệp Cưới</a>
  </div>
</body>
</html>
